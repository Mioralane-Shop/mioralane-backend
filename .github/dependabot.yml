# Dependabot — API
#
# Added in P1.5: the audit found 28 vulnerable packages in this repo alone, with
# nothing watching for the next one. Two repo-specific decisions:
#
#   * `@nestjs/*` is excluded. The audit established that `src/modules/**` — the
#     NestJS/TypeORM scaffold — is imported by no entrypoint (`main.ts` imports
#     `./app.module`, which is plain Express 5), so the six NestJS findings are
#     advisories in unreachable code. The fix is deletion (see
#     `src/modules/DELETION_PLAN.md`), not a 10.x -> 12.x major.
#   * `typescript` majors are excluded: `verify:types` type-checks the whole test
#     tree, so that one should be a deliberate migration too.
#
# Everything else — including the runtime packages that actually serve traffic
# (`express`, `mongoose`, `helmet`, `express-rate-limit`, `multer`, `joi`) — is
# left enabled, so the next `multer` advisory arrives as a PR instead of an audit.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        dependency-type: development
        update-types:
          - minor
          - patch
      prod-patches:
        dependency-type: production
        update-types:
          - patch
    ignore:
      - dependency-name: "@nestjs/*"
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
