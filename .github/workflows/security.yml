# P1.0 — security verification for the API.
#
# CI only: no deploy step, no Vercel trigger, no secrets. Every step was run
# locally with MONGODB_URI / JWT_SECRET / IMAGEKIT_* explicitly unset — the same
# environment this job gets — so the harnesses are proven not to need secrets.
# (They never load `.env`: only `main.ts` and `api/index.ts` import `src/env`.)
name: Backend security verification

on:
  push:
    branches:
      # `main` so mainline commits stay verified after this hardening work merges.
      # Without it the workflow would only ever run on the security branch, and a
      # broken main would not be noticed until the next pull request.
      - main
      # `security/**` rather than `security/*` so a nested branch name such as
      # `security/p1/csrf-token` also runs CI.
      - 'security/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Least privilege: this job only reads the repository.
permissions:
  contents: read

jobs:
  verify:
    name: Type-check and run verification harnesses
    runs-on: ubuntu-latest
    # A hung job would otherwise sit for the 6-hour default.
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 24 — the LTS line, and the same major local development runs (v24.9.0),
      # so CI and a developer's machine agree. This previously targeted 20, which
      # ran the whole suite on a major nobody develops against; a skew like that is
      # exactly how CI passes while local work breaks, or the reverse.
      #
      # The major line rather than an exact patch: `'24'` resolves to the newest
      # published 24.x on the runner (24.21.0 as of writing), so CI keeps running
      # and still picks up 24.x security releases. The cost is that the toolchain is
      # not pinned byte-for-byte — an exact version can be substituted here if that
      # guarantee is wanted and the runner can resolve it.
      #
      # 24 clears every requirement in the monorepo: the admin app is on Next 16
      # (needs >= 20.9) and the storefront on Next 14 (needs >= 18.17). Every command
      # in this workflow was run locally on v24.9.0 before it was committed, so this
      # names the major those runs actually used.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check src (build scope)
        run: npx tsc --noEmit

      # Beyond the original brief, deliberately. `tsc --noEmit` above compiles
      # `src/**` only, because tsconfig.json includes just that — so it cannot see
      # `tests/`, where five real errors sat invisibly until this config was
      # added. Without this step CI would not catch that class of error.
      - name: Type-check src + tests
        run: npm run verify:types

      - name: Verify validation layer
        run: npm run verify:validation

      - name: Verify error handler
        run: npm run verify:error-handler

      - name: Verify security headers, CORS, trust proxy and rate limits
        run: npm run verify:security-headers

      # P1.1. Runs the real middleware chain: the HMAC token guard, its four
      # negative controls, the auth-bootstrap exemptions and the CORS
      # `Access-Control-Allow-Headers` contract the browser depends on.
      - name: Verify CSRF token guard
        run: npm run verify:csrf

      - name: Verify admin route guards
        run: npm run verify:route-guards
